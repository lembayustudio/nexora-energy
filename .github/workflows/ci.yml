name: Astro build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/astro-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build Astro static site
        run: npm run build
