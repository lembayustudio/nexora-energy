<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 820" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Conceptual pumpjack schematic</title>
<desc id="desc">An illustrative industrial pumpjack drawn with technical lines and construction guides, not to scale.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#CED4CE" stroke-width=".65" opacity=".45"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(42)"><path d="M0 0V7" stroke="#9AA99C" stroke-width=".6"/></pattern>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#8A988E" stroke-width=".9"/></marker>
</defs>
<rect width="840" height="820" fill="#F0F2ED"/>
<rect x="45" y="55" width="750" height="710" fill="url(#grid)"/>
<g stroke="#C0C9C0" stroke-width="1" stroke-dasharray="5 7">
  <path d="M90 665H756M420 75V734M130 140H740M170 400H700"/>
  <rect x="96" y="130" width="655" height="560"/>
</g>
<g stroke="#294239" stroke-linecap="round" stroke-linejoin="round">
  <!-- Footings and frame -->
  <path d="M168 672H701M180 686H690M207 658H677" stroke-width="3"/>
  <path d="M236 659H530V676H236Z" fill="url(#hatch)" stroke-width="2"/>
  <path d="M330 658L424 316L505 658M352 581H480M369 526H466M386 470H449" stroke-width="9"/>
  <path d="M330 658L424 316L505 658M352 581H480M369 526H466M386 470H449" stroke="#F0F2ED" stroke-width="3"/>
  <path d="M336 637L492 637M358 564L480 564M384 490L464 490" stroke-width="1.2"/>
  <!-- Walking beam -->
  <path d="M149 326L632 216L641 256L166 363Z" fill="#E4EAE2" stroke-width="4"/>
  <path d="M163 343L635 237" stroke-width="1.2" stroke-dasharray="7 6"/>
  <path d="M200 320L213 362M249 306L261 342M299 295L310 328M351 284L361 318M403 272L413 306M455 261L463 297M507 249L515 288M560 235L567 272" stroke-width="1" opacity=".8"/>
  <!-- Head -->
  <path d="M622 210Q692 174 700 246L689 304L652 301L641 256Z" fill="#DDE7DA" stroke-width="3"/>
  <path d="M657 225Q682 231 680 273M650 248L687 248" stroke-width="1.5"/>
  <!-- Polished rod -->
  <path d="M691 290V658M678 290V658" stroke-width="2"/>
  <path d="M672 645H696V666H672Z" fill="#C9D9C6"/>
  <!-- Pivot -->
  <circle cx="423" cy="315" r="25" fill="#F0F2ED" stroke-width="5"/>
  <circle cx="423" cy="315" r="10" fill="#BCCEC0" stroke-width="3"/>
  <!-- Rear arm / crank -->
  <path d="M198 353L236 476L286 540" stroke-width="11"/>
  <path d="M198 353L236 476L286 540" stroke="#F0F2ED" stroke-width="3"/>
  <circle cx="286" cy="540" r="55" fill="url(#hatch)" stroke-width="4"/>
  <circle cx="286" cy="540" r="17" fill="#E3EEE3" stroke-width="3"/>
  <path d="M231 540H341M286 485V595" stroke-width="1.3"/>
  <!-- Engine and belt -->
  <rect x="116" y="594" width="126" height="57" rx="3" fill="#DCE8DC" stroke-width="3"/>
  <path d="M121 614H238M121 628H238M135 595V651M151 595V651M168 595V651M185 595V651" stroke-width="1.2"/>
  <circle cx="236" cy="617" r="23" fill="#F0F2ED" stroke-width="3"/>
  <circle cx="236" cy="617" r="8" fill="#D2E3D1" stroke-width="2"/>
  <path d="M250 603L259 573M257 632L263 579" stroke-width="2"/>
</g>
<!-- Callouts -->
<g fill="#35564A" font-family="Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">
  <text x="101" y="93">NX / FIELD SYSTEMS</text>
  <text x="586" y="93">FIG 01—A</text>
  <text x="98" y="204">WALKING BEAM</text>
  <text x="531" y="360">PIVOT ASSEMBLY</text>
  <text x="92" y="540">COUNTERWEIGHT</text>
  <text x="543" y="629">POLISHED ROD</text>
</g>
<g stroke="#84988A" stroke-width="1.3" fill="none" stroke-linecap="round">
  <path d="M215 213L261 294" marker-end="url(#arrow)"/>
  <path d="M531 349L451 318" marker-end="url(#arrow)"/>
  <path d="M228 537L193 542L170 542" marker-end="url(#arrow)"/>
  <path d="M598 610L684 585" marker-end="url(#arrow)"/>
  <path d="M118 717H698" stroke-dasharray="3 7"/>
</g>
<g fill="#65766A" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">
  <text x="112" y="743">ILLUSTRATIVE MECHANICAL STUDY</text>
  <text x="587" y="743">NOT TO SCALE</text>
</g>
</svg>